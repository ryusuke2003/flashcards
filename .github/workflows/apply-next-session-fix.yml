name: Apply next-session fix

on:
  push:
    branches:
      - fix/reload-next-study-session

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/reload-next-study-session

      - name: Patch study restart flow
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('Index.html')
          text = path.read_text()

          replacements = [
              (
                  "  var pendingDelete = null;\n  var gradeSync = {",
                  "  var pendingDelete = null;\n  var pendingNormalStartDeckKey = null;\n  var gradeSync = {",
              ),
              (
                  "  function maybeRefreshHomeAfterSync() {\n    if (!currentDeck || $('home').classList.contains('hidden')) return;\n    if (hasPendingForDeck(currentDeck.key)) return;\n    refreshHomeFromServer(false);\n  }",
                  "  function maybeRefreshHomeAfterSync() {\n    if (pendingNormalStartDeckKey !== null) {\n      continuePendingNormalStart();\n      return;\n    }\n    if (!currentDeck || $('home').classList.contains('hidden')) return;\n    if (hasPendingForDeck(currentDeck.key)) return;\n    refreshHomeFromServer(false);\n  }",
              ),
              (
                  "    currentDeck = null;\n    sessionData = null;\n    queue = [];",
                  "    pendingNormalStartDeckKey = null;\n    currentDeck = null;\n    sessionData = null;\n    queue = [];",
              ),
              (
                  "    $('flag-count').textContent = data.counts.flagged || 0;\n    $('due-btn').classList.toggle('hidden', !(data.counts.due > 0));",
                  "    $('flag-count').textContent = data.counts.flagged || 0;\n\n    var hasStudyTargets = Number(data.counts.due || 0) + Number(data.counts.fresh || 0) > 0;\n    var waitingForNextSession = pendingNormalStartDeckKey !== null;\n    $('start-btn').disabled = !hasStudyTargets || waitingForNextSession;\n    $('start-btn').textContent = waitingForNextSession\n      ? '学習結果を同期中…'\n      : (hasStudyTargets ? '学習を始める' : '今日の学習は完了');\n\n    $('due-btn').classList.toggle('hidden', !(data.counts.due > 0));",
              ),
              (
                  "  function startNormal() {\n    if (!sessionData || !sessionData.queue || !sessionData.queue.length) {\n      showEmpty('このデッキに今日の学習対象はありません。\\n復習日になったカードか未学習カードが追加されると、ここに表示されます。');\n      return;\n    }\n    startQueue(sessionData.queue, 'normal');\n  }",
                  "  function startNormal() {\n    if (sessionData && sessionData.queue && sessionData.queue.length) {\n      startQueue(sessionData.queue, 'normal');\n      return;\n    }\n    requestFreshNormalSession();\n  }\n\n  function requestFreshNormalSession() {\n    if (!currentDeck || pendingNormalStartDeckKey !== null) return;\n    if (pendingDelete) {\n      showToast('削除の復元待ちが終わってから次の学習を始めてください。');\n      return;\n    }\n\n    pendingNormalStartDeckKey = currentDeck.key;\n    $('start-btn').disabled = true;\n    $('start-btn').textContent = hasPendingForDeck(currentDeck.key)\n      ? '学習結果を同期中…'\n      : '次の学習を準備中…';\n\n    if (hasPendingForDeck(currentDeck.key)) {\n      processGradeQueue();\n      return;\n    }\n    continuePendingNormalStart();\n  }\n\n  function continuePendingNormalStart() {\n    if (pendingNormalStartDeckKey === null) return;\n    var requestedDeckKey = pendingNormalStartDeckKey;\n\n    if (!currentDeck || currentDeck.key !== requestedDeckKey) {\n      pendingNormalStartDeckKey = null;\n      return;\n    }\n    if (hasPendingForDeck(requestedDeckKey)) return;\n\n    callServer('getSession', [requestedDeckKey], function (data) {\n      if (pendingNormalStartDeckKey !== requestedDeckKey ||\n          !currentDeck || currentDeck.key !== requestedDeckKey) return;\n\n      pendingNormalStartDeckKey = null;\n      sessionData = data;\n      if (data && data.deck) currentDeck = data.deck;\n\n      if (data && data.queue && data.queue.length) {\n        startQueue(data.queue, 'normal');\n        return;\n      }\n      renderHome(data);\n    }, function () {\n      if (pendingNormalStartDeckKey === requestedDeckKey) {\n        pendingNormalStartDeckKey = null;\n        if (sessionData) renderHome(sessionData);\n      }\n    });\n  }",
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one match, found {count}: {old[:80]!r}')
              text = text.replace(old, new, 1)

          path.write_text(text)
          PY

      - name: Commit the fix
        shell: bash
        run: |
          rm -f .github/workflows/apply-next-session-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Index.html .github/workflows/apply-next-session-fix.yml
          git commit -m "Fix restarting study after a completed session"
          git push origin HEAD:fix/reload-next-study-session
